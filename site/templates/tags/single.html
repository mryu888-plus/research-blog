{% extends "base.html" %}
{% block title %}{{ term.name }} · {{ config.title }}{% endblock title %}
{% block content %}<a class="back-link" href="{{ get_url(path='tags/') }}">← 全部主题</a><header class="home-header"><p class="eyebrow">TOPIC</p><h1>{{ term.name }}</h1></header><div class="posts-list">{% for post in term.pages %}<article class="post-item"><time datetime="{{ post.date }}">{{ post.date }}</time><div class="post-info"><h2><a href="{{ post.permalink }}">{{ post.title }}</a></h2><p>{{ post.description | default(value="") }}</p></div></article>{% endfor %}</div>{% endblock content %}
