base_url = "https://mryu888-plus.github.io/research-blog/"
title = "Research Blog"
description = "记下尚未解开的疑问，也记下渐渐清晰的答案。"
default_language = "zh"

compile_sass = true
build_search_index = false
generate_feeds = true
feed_filenames = ["atom.xml"]
taxonomies = [{name = "tags", feed = true}]

[markdown]
render_emoji = false
insert_anchor_links = "heading"

[markdown.highlighting]
style = "inline"
theme = "ayu-dark"

[extra]
author = "Researcher"
enable_katex = true
agent_endpoint = ""
topic_tree = [
  { id = "learning", label = "学习与决策", children = [{ tag = "reinforcement-learning", children = [{ tag = "skill-discovery" }] }] },
  { id = "abstraction", label = "表示与抽象", children = [{ tag = "behavioral-equivalence" }] },
]

[extra.tag_labels]
reinforcement-learning = "强化学习"
skill-discovery = "技能发现"
behavioral-equivalence = "行为等价"

[extra.tag_descriptions]
reinforcement-learning = "从试错中学习，在行动中接近答案。"
skill-discovery = "从一次次经历中，寻找可以复用的经验。"
behavioral-equivalence = "越过表象的差异，辨认行为的共同之处。"
