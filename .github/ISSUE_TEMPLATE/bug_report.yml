name: Bug / 使用问题
description: 报告构建、预览、编辑器、风格同步或文献工作流的问题。
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: "请使用最小示例并脱敏日志。安全漏洞与敏感信息请先阅读 SECURITY.md，不要公开密钥、私人 PDF 或文献库。"
  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - 建站与静态构建
        - 实时预览
        - ZEN 与编辑器主题
        - Zotero 文献与引用
        - 公式与 Typst 图形
        - 双链、图谱、系列或搜索
        - VS Code 与可选 AI
        - 文档或其他
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境与版本
      description: 系统、插件版本或 commit，以及相关的 Python / Node / Zola / Typst / Zotero 版本。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤与最小示例
      description: 从哪个命令或页面开始？可以提供脱敏的小段 Markdown、配置或错误日志。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 相关截图或日志须去除个人内容和凭据。
    validations:
      required: true
