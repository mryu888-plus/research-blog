name: Rust checks
on:
  push:
    branches: [main]
    paths: ['crates/**', 'Cargo.toml', 'Cargo.lock', 'ZEN.md', 'design/visual-system/typst/**', 'site/templates/**', 'site/static/**', 'examples/starter/**', 'extensions/research-notes-theme/**', 'extensions/research-blog/snippets/**', '.github/workflows/rust.yml']
  pull_request:
    paths: ['crates/**', 'Cargo.toml', 'Cargo.lock', 'ZEN.md', 'design/visual-system/typst/**', 'site/templates/**', 'site/static/**', 'examples/starter/**', 'extensions/research-notes-theme/**', 'extensions/research-blog/snippets/**', '.github/workflows/rust.yml']
permissions:
  contents: read
jobs:
  test:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: ZEN outputs are current
        run: cargo run -q --locked -p blogctl -- zen --check
