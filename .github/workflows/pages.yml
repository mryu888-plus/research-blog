name: Publish research blog
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned build tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blog-tools"
          gh release download v0.23.4 --repo getzola/zola --pattern 'zola-v0.23.4-x86_64-unknown-linux-gnu.tar.gz' --dir "$RUNNER_TEMP/blog-tools"
          tar -xzf "$RUNNER_TEMP/blog-tools/zola-v0.23.4-x86_64-unknown-linux-gnu.tar.gz" -C "$RUNNER_TEMP/blog-tools"
          gh release download v0.15.1 --repo typst/typst --pattern 'typst-x86_64-unknown-linux-musl.tar.xz' --dir "$RUNNER_TEMP/blog-tools"
          tar -xJf "$RUNNER_TEMP/blog-tools/typst-x86_64-unknown-linux-musl.tar.xz" -C "$RUNNER_TEMP/blog-tools" --strip-components=1
          echo "$RUNNER_TEMP/blog-tools" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Test frontend
        run: node --test tests/frontend.test.cjs
      - name: Build static blog
        run: python scripts/build_site.py
      - name: Verify public links and content
        run: python scripts/check_site.py
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/public
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
