name: Publish research blog
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/research-blog/tools
          key: research-blog-tools-${{ runner.os }}-zola-0.23.4-typst-0.15.1
      - name: Install a Chinese font and build blogctl
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          cargo build --release --locked -p blogctl
          echo "$GITHUB_WORKSPACE/target/release" >> "$GITHUB_PATH"
      - name: Test frontend
        run: node --test tests/*.test.cjs
      - name: Build and check the blog
        run: blogctl check
      - name: Exercise a fresh site
        run: |
          set -euo pipefail
          blogctl init "$RUNNER_TEMP/starter" --name "演示" --author "Researcher" --url "https://example.invalid/notes/"
          blogctl --root "$RUNNER_TEMP/starter" check
          blogctl --root "$RUNNER_TEMP/starter" zen --check
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/public
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
